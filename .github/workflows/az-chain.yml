name: az-chain

# Perpetual Azure-IP lottery. Draw phase: 6 parallel runner IPs, each with a
# reverse-tunnel slot (18220-18225); the VPS judges the SOCKS exit end-to-end.
# WINNER (evidence 24 Oct: the tunnel path exits a stale Azure NAT mapping and
# is always dry, while direct runner egress tested 8/8 LIVE - fresh NAT IP per
# connection): the winning runner ALSO starts opencode2api locally (direct
# egress) and reverse-exposes it on VPS 127.0.0.1:18231. Losers exit in ~4 min;
# the run re-dispatches itself when all 6 are dry.

on:
  workflow_dispatch:

concurrency:
  group: az-chain
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 372
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Install local SOCKS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq microsocks >/dev/null
          nohup microsocks -i 127.0.0.1 -p 1922${{ matrix.slot }} >/dev/null 2>&1 &

      - name: Tunnel slot
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AZEXIT_SSH_KEY" | base64 -d > ~/.ssh/azexit
          chmod 600 ~/.ssh/azexit
          ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ExitOnForwardFailure=yes -N -T -R 127.0.0.1:1822${{ matrix.slot }}:127.0.0.1:1922${{ matrix.slot }} root@192.53.174.27 &
          echo $! > tunnel.pid
          sleep 5
          kill -0 $(cat tunnel.pid) && echo "tunnel slot ${{ matrix.slot }} up"
          EGRESS=$(curl -s --max-time 15 https://api.ipify.org)
          echo "EGRESS=$EGRESS" >> "$GITHUB_ENV"

      - name: VPS judges end-to-end
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
        run: |
          if ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no root@192.53.174.27 "bash /opt/agent-gateway/pool/stack/azverify.sh ${{ matrix.slot }}"; then
            echo "WINNER slot ${{ matrix.slot }}: $EGRESS"
          else
            echo "dry: $EGRESS"
            exit 1
          fi

      - name: Winner - start engine locally + expose API to VPS
        if: success()
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          mkdir -p /tmp/azengine
          printf '%s' '{"listen":"127.0.0.1:8081","server_keys":["local-test-key"],"anonymous":true,"proxyfile":"","webui":{"enabled":false}}' > /tmp/azengine/config.json
          docker rm -f azengine 2>/dev/null
          docker run -d --name azengine --network host -v /tmp/azengine/config.json:/var/lib/opencode2api/config.json:ro ghcr.io/jasonxu114514/opencode2api:v1.4.3 >/dev/null
          sleep 12
          CODE=$(curl -s -o /tmp/win.json -w "%{http_code}" --max-time 60 -H "Authorization: Bearer local-test-key" -H "Content-Type: application/json" -d '{"model":"beam-free","messages":[{"role":"user","content":"Reply PONG"}],"max_tokens":8}' http://127.0.0.1:8081/v1/chat/completions)
          echo "runner engine sanity: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "runner engine did not go live - not a winner after all"
            exit 1
          fi
          ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ExitOnForwardFailure=yes -N -T -R 127.0.0.1:18231:127.0.0.1:8081 root@192.53.174.27 &
          echo $! > api.pid
          sleep 5
          kill -0 $(cat api.pid) && echo "API tunnel up: VPS 127.0.0.1:18231 -> runner engine"
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="AZ WINNER: $EGRESS (slot ${{ matrix.slot }}) - engine LIVE di runner, API via VPS:18231" >/dev/null

      - name: Hold shift (winner only)
        if: success()
        run: |
          for i in $(seq 1 140); do
            sleep 152
            if [ -f api.pid ] && ! kill -0 $(cat api.pid) 2>/dev/null; then rm -f api.pid; fi
            if [ ! -f api.pid ]; then
              ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -N -T -R 127.0.0.1:18231:127.0.0.1:8081 root@192.53.174.27 &
              echo $! > api.pid
            fi
          done

      - name: Shift end cleanup (winner only)
        if: success() && always()
        env:
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          docker rm -f azengine 2>/dev/null
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="AZ shift habis: $EGRESS. Lottery lanjut." >/dev/null

  chain:
    needs: draw
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-dispatch only if no run is already spinning
        env:
          GH_TOKEN: ${{ secrets.AZEXIT_PAT }}
        run: |
          sleep 120
          BUSY=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/az-chain.yml/runs?status=in_progress&per_page=20" | python3 -c "import sys,json,os; rs=json.load(sys.stdin).get('workflow_runs',[]); me=os.environ.get('GITHUB_RUN_ID'); print(sum(1 for r in rs if str(r['id'])!=me))")
          if [ "$BUSY" != "0" ]; then
            echo "another run is already in progress ($BUSY) - no re-dispatch"
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/az-chain.yml/dispatches" -d '{"ref":"main"}' && echo "chain re-dispatched"