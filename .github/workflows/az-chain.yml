name: az-chain

# Perpetual Azure-IP lottery: each run draws SIX runner IPs in parallel, each
# with its own reverse-tunnel slot (18220-18225); the VPS judges end-to-end.
# A winner holds a 6h shift as the engine's #1 exit. Losers exit in ~4 min.
# If every draw is dry, the run re-dispatches itself: the lottery never stops.

on:
  workflow_dispatch:

concurrency:
  group: az-chain
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 372
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        slot: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Install local SOCKS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq microsocks >/dev/null
          nohup microsocks -i 127.0.0.1 -p 1922${{ matrix.slot }} >/dev/null 2>&1 &

      - name: Tunnel slot
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AZEXIT_SSH_KEY" | base64 -d > ~/.ssh/azexit
          chmod 600 ~/.ssh/azexit
          ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ExitOnForwardFailure=yes -N -T -R 127.0.0.1:1822${{ matrix.slot }}:127.0.0.1:1922${{ matrix.slot }} root@192.53.174.27 &
          echo $! > tunnel.pid
          sleep 5
          kill -0 $(cat tunnel.pid) && echo "tunnel slot ${{ matrix.slot }} up"
          EGRESS=$(curl -s --max-time 15 https://api.ipify.org)
          echo "EGRESS=$EGRESS" >> "$GITHUB_ENV"

      - name: VPS judges end-to-end
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          if ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no root@192.53.174.27 "bash /opt/agent-gateway/pool/stack/azverify.sh ${{ matrix.slot }}"; then
            echo "WINNER slot ${{ matrix.slot }}: $EGRESS"
            curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="AZ WINNER: $EGRESS (slot ${{ matrix.slot }}) - 200 end-to-end, exit utama 6 jam" >/dev/null
          else
            echo "dry: $EGRESS"
            exit 1
          fi

      - name: Hold shift (winner only)
        if: success()
        run: |
          for i in $(seq 1 140); do
            sleep 152
            if ! kill -0 $(cat tunnel.pid) 2>/dev/null; then
              ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no -o ExitOnForwardFailure=yes -N -T -R 127.0.0.1:1822${{ matrix.slot }}:127.0.0.1:1922${{ matrix.slot }} root@192.53.174.27 &
              echo $! > tunnel.pid
            fi
          done

      - name: Shift end cleanup (winner only)
        if: success() && always()
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no root@192.53.174.27 "python3 /opt/agent-gateway/azverify/detach.py" || true
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" -d text="AZ shift habis: $EGRESS. Lottery lanjut." >/dev/null

  chain:
    needs: draw
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-dispatch only if no run is already spinning
        env:
          GH_TOKEN: ${{ secrets.AZEXIT_PAT }}
        run: |
          sleep 120
          BUSY=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/az-chain.yml/runs?status=in_progress&per_page=1" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_count',0))")
          if [ "$BUSY" != "0" ]; then
            echo "another run is already in progress ($BUSY) - no re-dispatch"
            exit 0
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/az-chain.yml/dispatches" -d '{"ref":"main"}' && echo "chain re-dispatched"