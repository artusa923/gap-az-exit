name: az-tunnel

# Azure egress lottery with END-TO-END verification: the runner opens the
# reverse tunnel FIRST, then the VPS itself verifies through a real engine on
# the tunnel path (azverify.sh). Only a verified-200 egress holds the shift.
# A dry draw exits fast; the next hourly run draws a new IP. Public repo =
# unlimited minutes.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: az-tunnel
  cancel-in-progress: true

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Install local SOCKS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq microsocks >/dev/null
          nohup microsocks -i 127.0.0.1 -p 19222 >/dev/null 2>&1 &

      - name: Open reverse tunnel to VPS
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AZEXIT_SSH_KEY" | base64 -d > ~/.ssh/azexit
          chmod 600 ~/.ssh/azexit
          ssh -i ~/.ssh/azexit \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -o ExitOnForwardFailure=yes -N -T \
            -R 127.0.0.1:18222:127.0.0.1:19222 \
            root@192.53.174.27 &
          echo $! > tunnel.pid
          sleep 5
          kill -0 $(cat tunnel.pid) && echo "tunnel up"
          EGRESS=$(curl -s --max-time 15 https://api.ipify.org)
          echo "EGRESS=$EGRESS" >> "$GITHUB_ENV"

      - name: END-TO-END verify through the tunnel (VPS judges)
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          if ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no root@192.53.174.27 \
               "bash /opt/agent-gateway/pool/stack/azverify.sh"; then
            echo "EGRESS VERIFIED FRESH end-to-end"
          else
            echo "dry draw - notify + redraw next hour"
            curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" \
              -d text="🎲 AZ draw $EGRESS: kering (terverifikasi end-to-end). Undian baru jam depan." >/dev/null
            exit 1
          fi

      - name: Report shift start
        env:
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🟢 AZ shift LIVE: $EGRESS terverifikasi 200 END-TO-END, jadi exit utama engine ±6 jam" >/dev/null

      - name: Hold the shift (renew tunnel if it drops)
        run: |
          for i in $(seq 1 138); do
            sleep 150
            if ! kill -0 $(cat tunnel.pid) 2>/dev/null; then
              ssh -i ~/.ssh/azexit \
                -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                -o ExitOnForwardFailure=yes -N -T \
                -R 127.0.0.1:18222:127.0.0.1:19222 \
                root@192.53.174.27 &
              echo $! > tunnel.pid
            fi
          done

      - name: Report shift end + detach exit
        if: always()
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          ssh -i ~/.ssh/azexit -o StrictHostKeyChecking=no root@192.53.174.27 \
            "python3 -c \"import json; p='/opt/agent-gateway/pool/stack/config.json'; c=json.load(open(p)); c['proxies']=[x for x in c['proxies'] if '18222' not in x]; json.dump(c,open(p,'w'),indent=2)\" || true" || true
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🔴 AZ shift selesai: $EGRESS turun. Undian baru jam depan." >/dev/null