name: az-tunnel

# Azure egress lottery: each run draws a runner IP, verifies it is FRESH with a
# real opencode turn, and only then holds a 6h reverse-tunnel shift for the VPS
# engine. A dry IP fails fast so the next hourly run draws a new one. Public
# repo = unlimited Actions minutes.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # hourly lottery ticket

concurrency:
  group: az-tunnel
  cancel-in-progress: true

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    steps:
      - name: Install opencode + local SOCKS
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq microsocks >/dev/null
          nohup microsocks -i 127.0.0.1 -p 19222 >/dev/null 2>&1 &

      - name: Draw the IP and verify it is FRESH (fail fast if dry)
        env:
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          EGRESS=$(curl -s --max-time 15 https://api.ipify.org)
          echo "EGRESS=$EGRESS" >> "$GITHUB_ENV"
          echo "drawn egress: $EGRESS"
          if timeout 90 opencode run -m opencode/beam-free "Reply with the single word PONG" > /tmp/warm.txt 2>&1; then
            echo "IP FRESH - holding shift"
          else
            echo "IP DRY - redraw next hour"
            curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              -d chat_id="$TG_CHAT" -d text="🎲 AZ draw $EGRESS: kering. Undian baru jam depan." >/dev/null
            exit 1
          fi

      - name: Open reverse tunnel to VPS
        env:
          AZEXIT_SSH_KEY: ${{ secrets.AZEXIT_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$AZEXIT_SSH_KEY" | base64 -d > ~/.ssh/azexit
          chmod 600 ~/.ssh/azexit
          ssh -i ~/.ssh/azexit \
            -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
            -o ExitOnForwardFailure=yes -N -T \
            -R 127.0.0.1:18222:127.0.0.1:19222 \
            root@192.53.174.27 &
          echo $! > tunnel.pid
          sleep 5
          kill -0 $(cat tunnel.pid) && echo "tunnel up"

      - name: Report shift start
        env:
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🟢 AZ shift LIVE: egress $EGRESS fresh + terverifikasi, tunnel 18222 hidup ±6 jam" >/dev/null

      - name: Hold the shift (renew tunnel if it drops)
        run: |
          for i in $(seq 1 138); do
            sleep 150
            if ! kill -0 $(cat tunnel.pid) 2>/dev/null; then
              ssh -i ~/.ssh/azexit \
                -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                -o ExitOnForwardFailure=yes -N -T \
                -R 127.0.0.1:18222:127.0.0.1:19222 \
                root@192.53.174.27 &
              echo $! > tunnel.pid
            fi
          done

      - name: Report shift end
        if: always()
        env:
          TG_TOKEN: ${{ secrets.AZEXIT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.AZEXIT_TG_CHAT }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            -d chat_id="$TG_CHAT" \
            -d text="🔴 AZ shift selesai: egress $EGRESS turun. Undian baru jam depan." >/dev/null